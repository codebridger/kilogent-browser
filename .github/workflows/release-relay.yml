name: Release relay

# Two channels, one file:
#   push to dev   ->  <version>-dev.<run_number>   on dist-tag `dev`
#   push to main  ->  <version>                    on dist-tag `latest`
#
# So `npm i -g @lumi.ai/relay` gets the production release and `@lumi.ai/relay@dev` gets the
# pre-release, and the two lists never mix. A dev prerelease also SORTS BELOW the release it is
# working towards (`0.3.0-dev.7` < `0.3.0`), so it can never outrank what is already on `latest`.
#
# THE VERSION IS DERIVED, never typed. `scripts/resolve-relay-version.mjs` walks the commits since
# the last publish and picks the bump. The `version` in package.json is only a seed for a first
# publish — do not bump it by hand. Read that script's docblock for why the PATH filter decides
# *whether* to release while the commit type only decides *how big*, and why an unrecognised type
# falls through to a patch rather than to "no release".
#
# ⚠️ npm MATCHES A TRUSTED PUBLISHER ON THE WORKFLOW FILENAME as well as the org and repo. Renaming
# this file breaks publishing until npmjs.com is updated to match.

on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/relay/**'
      - 'scripts/resolve-relay-version.mjs'
      - '.github/workflows/release-relay.yml'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Publish this exact version instead of deriving one. Needed exactly once, for the first
          publish from this repository: the boundary is npm's own `gitHead` for the current
          version, and 0.1.2 was published from a DIFFERENT repo, so its gitHead cannot be resolved
          here and the resolver correctly refuses to guess. One explicit publish re-establishes it.
        required: false
        type: string
      channel:
        description: 'dist-tag to publish under'
        required: false
        default: dev
        type: choice
        options: [dev, latest]

concurrency:
  # Per channel, NOT per workflow: dev and main are independent releases that may legitimately be
  # in flight at the same time, and cancelling one because the other started would silently skip it.
  group: release-relay-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY. The resolver walks `git log <boundary>..HEAD`, and a shallow clone cannot
          # resolve the boundary commit — it would fail closed on every run.
          fetch-depth: 0

      # NO `registry-url` HERE, and it looks like the obvious thing to set. setup-node
      # unconditionally writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an .npmrc,
      # and with no token in the environment that expands to an EMPTY token. npm then believes auth
      # is already configured, never starts the OIDC exchange, and the publish dies with
      # `E404 ... you do not have permission` — which reads exactly like a missing trusted publisher
      # and is not. (actions/setup-node#1551. The tell in the log is
      # `npm warn Unknown user config "always-auth"`, a line only setup-node's .npmrc adds.)
      # npm publishes to registry.npmjs.org by default, so omitting it costs nothing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm >= 11.5.1. Node 22 ships npm 10.x, which has NO OIDC support at all — without this the
      # publish looks for an auth token, finds none, and fails with ENEEDAUTH.
      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@latest

      - name: Assert no npm auth is configured
        # OIDC engages only when npm finds NO credentials, so prove that BEFORE publishing. Without
        # this check, a bad trusted-publisher registration and a stray empty token shadowing OIDC
        # produce the identical `E404 ... you do not have permission`.
        run: |
          echo "npm $(npm -v), node $(node -v)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm will use it instead of OIDC. Remove it."
            exit 1
          fi
          TOKEN_CFG=$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || echo undefined)
          echo "configured authToken: ${TOKEN_CFG}"
          case "$TOKEN_CFG" in
            undefined|null|'') echo "No token configured — OIDC is free to engage." ;;
            *) echo "::error::An npm authToken is configured (setup-node's registry-url?). It shadows OIDC."; exit 1 ;;
          esac

      - run: npm ci

      - name: Verify before publishing
        # The relay's own lanes only. ci.yml covers the extension, and re-running it here would
        # double every push for no extra signal.
        run: |
          npm run typecheck -w packages/relay
          npm run test:unit -w packages/relay
          node scripts/resolve-relay-version.mjs --self-test

      - name: Resolve the version and channel
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./packages/relay/package.json').name")

          if [ -n "${INPUT_VERSION}" ]; then
            # The manual escape hatch. See the `version` input above.
            VERSION="${INPUT_VERSION}"
            TAG="${INPUT_CHANNEL:-dev}"
            RELEASE=true
            echo "::notice::Explicit version requested: $NAME@$VERSION on dist-tag $TAG"
          else
            RESOLVED=$(node scripts/resolve-relay-version.mjs)
            node scripts/resolve-relay-version.mjs --preview
            RELEASE=$(node -p 'JSON.parse(process.argv[1]).release' "$RESOLVED")
            BASE=$(node -p 'JSON.parse(process.argv[1]).version' "$RESOLVED")
            BUMP=$(node -p 'JSON.parse(process.argv[1]).bump' "$RESOLVED")
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              VERSION="$BASE"
              TAG="latest"
            else
              # The run number is monotonic and never resets, so two dev builds of the same base
              # version can never collide.
              VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
              TAG="dev"
            fi
            if [ "$RELEASE" != "true" ]; then
              echo "::notice::Nothing to release — no commit since $NAME@$BASE touched packages/relay."
            else
              echo "Resolved $NAME@$VERSION (dist-tag $TAG, $BUMP bump) from ${GITHUB_REF_NAME}"
            fi
          fi

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already published
        id: exists
        # Idempotency. A re-run would otherwise fail with `403 You cannot publish over the
        # previously published versions` — a red X for doing nothing wrong. `npm view` exits
        # non-zero for a package that does not exist at all, so the `|| echo '[]'` is load-bearing.
        if: steps.v.outputs.release == 'true'
        run: |
          set -uo pipefail
          PUBLISHED=$(npm view "${{ steps.v.outputs.name }}" versions --json 2>/dev/null || echo '[]')
          FOUND=$(node -e '
            const wanted = process.argv[1];
            let list = [];
            try { list = JSON.parse(process.argv[2]); } catch {}
            if (!Array.isArray(list)) list = [list];
            process.stdout.write(list.includes(wanted) ? "yes" : "no");
          ' "${{ steps.v.outputs.version }}" "$PUBLISHED")
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = "yes" ]; then
            echo "::notice::${{ steps.v.outputs.name }}@${{ steps.v.outputs.version }} is already published — skipping."
          fi

      - name: Stamp the version
        if: steps.v.outputs.release == 'true' && steps.exists.outputs.found == 'no'
        # Before the build: `version.ts` reads package.json at runtime and the daemon reports it, so
        # stamping afterwards would ship a build whose reported version disagrees with the registry.
        # Never committed back — the checkout is throwaway.
        run: npm pkg set version=${{ steps.v.outputs.version }} -w packages/relay

      - name: Build
        if: steps.v.outputs.release == 'true' && steps.exists.outputs.found == 'no'
        run: npm run build -w packages/relay

      - name: Smoke-test the tarball
        if: steps.v.outputs.release == 'true' && steps.exists.outputs.found == 'no'
        # Installs the REAL tarball outside the repo and runs the REAL binary by name — the only
        # check that catches a broken `bin` mapping or a file missing from `files`, both of which
        # every other test passes straight through.
        run: |
          set -euo pipefail
          TARBALL=$(cd packages/relay && npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "Packed $TARBALL"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "$RUNNER_TEMP/$TARBALL"
          OUT=$(./node_modules/.bin/lumi-relay --version)
          echo "lumi-relay --version -> $OUT"
          test "$OUT" = "${{ steps.v.outputs.version }}"

      - name: Publish
        if: steps.v.outputs.release == 'true' && steps.exists.outputs.found == 'no'
        run: npm publish -w packages/relay --tag ${{ steps.v.outputs.tag }} --access public

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.v.outputs.name }}"
            echo
            if [ "${{ steps.v.outputs.release }}" = "true" ] && [ "${{ steps.exists.outputs.found }}" = "no" ]; then
              echo "Published \`${{ steps.v.outputs.version }}\` on dist-tag \`${{ steps.v.outputs.tag }}\`."
              echo
              echo '```'
              echo "npm i -g ${{ steps.v.outputs.name }}@${{ steps.v.outputs.tag }}"
              echo '```'
            else
              echo "No publish. Nothing since the last release touched \`packages/relay\`, or that version already exists."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
