<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.45 -apple-system, system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 14px 16px;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .sub { color: #8889; font-size: 11px; margin: 0 0 12px; }
      .note { color: #8889; font-size: 11px; margin: 6px 0 0; }
      label { display: block; font-weight: 600; margin: 8px 0 3px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        border: 1px solid #8884;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 7px 10px;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
      }
      button.secondary { background: #8883; color: inherit; }
      button.ghost {
        flex: 0 0 auto;
        background: transparent;
        border: 1px solid #8884;
        color: inherit;
        padding: 4px 8px;
        font-size: 11px;
      }
      .hidden { display: none !important; }
      .state { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 8px 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #8886; flex: none; }
      .dot.ok { background: #16a34a; }
      .dot.warn { background: #d97706; }
      .dot.err { background: #dc2626; }
      .code {
        font: 600 20px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-align: center;
        margin: 10px 0 4px;
      }
      .list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
      .pick {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #8883;
        border-radius: 8px;
        padding: 7px 9px;
        cursor: pointer;
      }
      .pick.on { border-color: #2563eb; background: #2563eb14; }
      .pick .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #8883;
        border-radius: 6px;
        padding: 4px 8px;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .chip .x { cursor: pointer; color: #dc2626; font-weight: 700; }
      .who { font-size: 11px; color: #8889; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      details { margin-top: 14px; border-top: 1px solid #8883; padding-top: 10px; }
      summary { cursor: pointer; font-size: 11px; color: #8889; }
      .profiles { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      .profile { border: 1px solid #8883; border-radius: 8px; padding: 8px 10px; }
      .profile .top { display: flex; align-items: center; gap: 8px; }
      .profile .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .profile .url { font-size: 11px; color: #8889; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .profile .actions { display: flex; gap: 6px; margin-top: 6px; }
      .switch { position: relative; width: 34px; height: 20px; flex: none; }
      .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .slider { position: absolute; inset: 0; background: #8885; border-radius: 999px; transition: 0.15s; pointer-events: none; }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px; height: 16px;
        left: 2px; top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: 0.15s;
      }
      .switch input:checked + .slider { background: #2563eb; }
      .switch input:checked + .slider::before { transform: translateX(14px); }
      .err { color: #dc2626; font-size: 11px; margin-top: 8px; }
      .empty { color: #8889; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Kilogent Browser</h1>
    <p class="sub">Lend this Chrome to your workspace. Agents use sites you are already signed in to — they never see a password.</p>

    <!-- One <section> per registered panel, filled by that panel. Structure is upstream's. -->
    <div id="panels"></div>

    <div class="row">
      <button id="reconnect" class="secondary">Reconnect</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
